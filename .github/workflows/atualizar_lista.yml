name: Atualizar Lista IPTV Automática

on:
  schedule:
    # Roda automaticamente todos os dias às 06:00 AM (Horário UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Permite rodar manualmente clicando no botão

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar Extrator
      run: python extrator.py

    - name: Commitar e dar Push na lista atualizada
      run: |
        git config --local user.email "104462712+JulioCesarXY@users.noreply.github.com"
        git config --local user.name "JulioCesarXY"
        # CORREÇÃO AQUI: Mudado para o nome real gerado pelo script
        git add lista_completa_parsatv.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Lista de canais atualizada" && git push)
