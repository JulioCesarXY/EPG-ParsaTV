name: Atualizar Lista IPTV Automática

on:
  schedule:
    # Roda automaticamente todos os dias às 06:00 AM (Horário UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Permite que você clique em um botão para atualizar manualmente quando quiser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório para a máquina virtual
    - name: Checkout do código
      uses: actions/checkout@v4

    # 2. Configura o ambiente Python estável
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instala as dependências (requests e bs4)
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Executa o script extrator para coletar os novos links
    - name: Executar Extrator
      run: python extrator.py

    # 5. Salva as alterações de volta no seu repositório de forma automática
    - name: Commitar e dar Push na lista atualizada
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add lista_canais.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Lista de canais atualizada" && git push)
